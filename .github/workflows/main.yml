name: Hola mundo
on:
  push:
  workflow_dispatch:
    inputs:
      saludo:
        type: choice
        options: [Hola, Buenas , Qué tal]
jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Hola ${{ github.actor}}, commit ${{github.sha}}"
      - run: 'echo"Elegiste: ${{ inputs.saludo}}"'
